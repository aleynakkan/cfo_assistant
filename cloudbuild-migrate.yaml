steps:
# 1) Build migration image
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/cfoseyfo-test/migration-job', '-f', 'Dockerfile.migrate', '.']
  dir: 'backend'

# 2) Start Cloud SQL Auth Proxy (background)
- name: 'gcr.io/cloud-builders/docker'
  args:
    - 'run'
    - '-d'
    - '--name=cloudsql-proxy'
    - '--network=cloudbuild'
    - '-v'
    - '/cloudsql:/cloudsql'
    - 'gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.3'
    - '--address=0.0.0.0'
    - '--port=5432'
    - 'cfoseyfo-test:us-central1:cfoseyfodbqa'

# 3) Wait for proxy to be ready
- name: 'gcr.io/cloud-builders/docker'
  args: ['run', '--network=cloudbuild', 'busybox', 'sh', '-c', 'sleep 5']

# 4) Fetch DB password from Secret Manager into a file
- name: 'gcr.io/cloud-builders/gcloud'
  entrypoint: 'bash'
  args:
    - '-c'
    - 'gcloud secrets versions access latest --secret=db-password --project=cfoseyfo-test > /workspace/dbpass.txt'

# 5) Run migrations (reads password from mounted file)
- name: 'gcr.io/cloud-builders/docker'
  args:
    - 'run'
    - '--network=cloudbuild'
    - '-v'
    - '/workspace:/workspace'
    - '-e'
    - 'DB_HOST=cloudsql-proxy'
    - '-e'
    - 'ENV=production'
    - 'gcr.io/cfoseyfo-test/migration-job'

# 6) Stop proxy
- name: 'gcr.io/cloud-builders/docker'
  args: ['stop', 'cloudsql-proxy']

options:
  logging: CLOUD_LOGGING_ONLY
